name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  tests:
    # Only in the public repo: a copy of this file in a private source repo uses no Actions minutes.
    if: github.repository == 's-boris/claude-assistant'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.20
      - name: Container layout (an empty /home/node built from this checkout; the scripts expect it)
        run: sudo mkdir -p /home/node && sudo chown "$USER" /home/node && bash tools/ci-home.sh /home/node
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils jq
      - name: Offline test suites (tools/ci-skip.txt lists the ones needing extra runtimes)
        env:
          TZ: Europe/Zurich
          HOME: /home/node
        run: bash tools/run-tests.sh --ci
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Plugin tests (telegram-plus with bun, heartbeat with node)
        run: bash tools/run-tests.sh --plugins

  privacy:
    # Only in the public repo: a copy of this file in a private source repo uses no Actions minutes.
    if: github.repository == 's-boris/claude-assistant'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (pinned binary, checksum-verified)
        run: |
          curl -fsSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && ./gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: pdftotext for the PDF check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - name: Private denylist + PII + prose + syntax gate
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
        run: |
          [ -n "$PUBLIC_DENYLIST" ] || echo "::warning::PUBLIC_DENYLIST is not set (forks get no secrets): PII and prose checks only"
          python3 -I tools/public-gate.py --ignore s-boris
